[build]
  publish = "."
  ignore = "if [ -z \"$CACHED_COMMIT_REF\" ] || [ -z \"$COMMIT_REF\" ]; then echo \"No cached commit ref available - building\"; exit 1; fi; git diff --quiet \"$CACHED_COMMIT_REF\" \"$COMMIT_REF\" -- . ':(exclude).github/**' ':(exclude)diff.txt' ':(exclude)deploy.ps1' ':(exclude)server.js'"

[[redirects]]
  from = "/__/auth/*"
  to = "https://coalition-aec44.firebaseapp.com/__/auth/:splat"
  status = 200

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

[build.environment]
  NODE_VERSION = "22"

[[headers]]
  for = "/*"
  [headers.values]
    Cross-Origin-Opener-Policy = "same-origin-allow-popups"
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains; preload"
    # CSP: 'unsafe-inline' kept for Firebase/Stripe/PayPal + existing inline scripts; tighten to nonces/hashes in next pass
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline' https://www.gstatic.com https://www.googletagmanager.com https://js.stripe.com https://www.paypal.com https://*.paypal.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://fonts.gstatic.com; img-src 'self' data: https: blob:; connect-src 'self' https://*.firebaseio.com https://*.googleapis.com https://*.firebase.com https://api.stripe.com https://*.paypal.com https://api-m.paypal.com https://api-m.sandbox.paypal.com wss: https:; frame-src https://js.stripe.com https://*.paypal.com https://www.gstatic.com; font-src 'self' https://fonts.gstatic.com data:"

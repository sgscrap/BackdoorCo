<!-- Shared storefront helpers -->
<script>
    // Dismiss the announcement bar and its offsets.
    function closeAnnounce() {
        var bar = document.getElementById('announceBar');
        var nav = document.getElementById('navbar');
        if (bar) bar.style.display = 'none';
        if (nav) nav.classList.remove('announce-offset');
        var hero = document.querySelector('.hero');
        if (hero) hero.classList.remove('announce-offset-section');
    }

    // Footer newsletter signup (forms call handleFooterSignup on submit).
    function handleFooterSignup(e) {
        e.preventDefault();
        var input = document.getElementById('footerEmailInput');
        if (input && input.value) {
            input.value = '';
            input.placeholder = "You're in. Welcome to the back.";
            input.disabled = true;
        }
    }

    // Collapse the navbar once the page is scrolled.
    window.addEventListener('scroll', function () {
        var nav = document.getElementById('navbar');
        if (nav) nav.classList.toggle('scrolled', window.scrollY > 50);
    });
</script>

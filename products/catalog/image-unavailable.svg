<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" role="img" aria-label="Photo coming soon" preserveAspectRatio="xMidYMid meet">
  <defs>
    <radialGradient id="bd-glow" cx="50%" cy="40%" r="62%">
      <stop offset="0%" stop-color="#242424"/>
      <stop offset="55%" stop-color="#1c1c1c"/>
      <stop offset="100%" stop-color="#151515"/>
    </radialGradient>
    <linearGradient id="bd-sheen" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.05"/>
      <stop offset="55%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- Dark well that blends into the storefront's product image containers -->
  <rect width="800" height="800" fill="url(#bd-glow)"/>
  <rect x="26" y="26" width="748" height="748" rx="36" fill="none" stroke="#ffffff" stroke-opacity="0.06" stroke-width="2"/>
  <rect width="800" height="800" fill="url(#bd-sheen)"/>

  <!-- Minimal image glyph with the brand's volt accent -->
  <g fill="none" stroke="#3a3a3a" stroke-width="16" stroke-linecap="round" stroke-linejoin="round">
    <rect x="288" y="288" width="224" height="182" rx="22"/>
    <path d="M288 424 L352 366 L404 416 L458 362 L512 420"/>
  </g>
  <circle cx="458" cy="334" r="17" fill="#3a3a3a"/>
  <circle cx="512" cy="288" r="13" fill="#a3e635" fill-opacity="0.8"/>

  <!-- Caption -->
  <text x="400" y="560" text-anchor="middle"
        font-family="Outfit, -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif"
        font-size="27" font-weight="600" letter-spacing="8" fill="#6b6b6b">PHOTO COMING SOON</text>

  <!-- Wordmark -->
  <g transform="translate(400 648)">
    <text text-anchor="middle"
          font-family="Outfit, -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif"
          font-size="30" font-weight="800" letter-spacing="6" fill="#414141">BACKDOOR</text>
    <circle cx="128" cy="-10" r="6" fill="#006340"/>
  </g>
</svg>
